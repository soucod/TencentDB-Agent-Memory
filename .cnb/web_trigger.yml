# CNB 手动触发流水线配置
# 文档: https://docs.cnb.cool/zh/build/web-trigger.html
#
# 这个文件配置的按钮会显示在「分支详情页」上
# 点击按钮后会触发 .cnb.yml 中对应的 web_trigger 事件

branch:
  # 所有分支都显示的快速部署按钮
  - buttons:
      - name: 🚀 快速部署
        # description 作为流水线标题，只能替换 env/inputs 中定义的变量
        # CNB_BRANCH 是系统变量，无法在此替换，会在 .cnb.yml 的 name 中显示
        description: 手动部署 → ${TARGET_ENV}/${DEPLOY_TARGET}
        event: web_trigger_quick_deploy
        isDefault: true
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          - name: 部署配置
            collapsed: false
            inputs:
              APP_NAME:
                name: 0. 目标应用
                description: 选择要构建的应用 (Monorepo)
                type: select
                required: true
                default: web-antd
                options:
                  - name: Ant Design (web-antd)
                    value: web-antd
                  - name: Element Plus (web-ele-playground)
                    value: web-ele-playground
                  - name: Naive UI (web-naive)
                    value: web-naive
                  - name: TDesign (web-tdesign)
                    value: web-tdesign
              TARGET_ENV:
                name: 1. 部署环境
                description: 选择要部署的目标环境
                type: select
                required: true
                default: dev
                options:
                  - name: 开发环境 (dev)
                    value: dev
                    description: 开发环境，用于日常开发测试
                  - name: 本地环境 (local)
                    value: local
                    description: 本地环境，用于本地化部署
                  - name: 测试环境 (test)
                    value: test
                    description: 测试环境，用于集成测试
              DEPLOY_TARGET:
                name: 2. 部署服务器
                description: 选择部署到哪个服务器
                type: select
                required: true
                default: onprem
                options:
                  - name: 本地化服务器 (nginx)
                    value: onprem
                    description: 部署到本地 nginx 服务器
                  - name: 阿里云 OSS
                    value: oss
                    description: 部署到阿里云对象存储
                  - name: 两者都部署
                    value: both
                    description: 同时部署到本地服务器和阿里云 OSS
          - name: 高级选项
            collapsed: true
            inputs:
              COMMIT_SHA:
                name: 指定提交
                description: 输入 commit hash 前8位，留空使用最新提交
                type: input
                required: false
              SKIP_NPM:
                name: 跳过 NPM 发布
                description: 跳过 npm 发布步骤
                type: switch
                default: "true"
                options:
                  - name: 跳过
                    value: "true"
                  - name: 不跳过
                    value: "false"
              SKIP_DOCKER:
                name: 跳过 Docker 构建
                description: 跳过 Docker 镜像构建
                type: switch
                default: "true"
                options:
                  - name: 跳过
                    value: "true"
                  - name: 不跳过
                    value: "false"
