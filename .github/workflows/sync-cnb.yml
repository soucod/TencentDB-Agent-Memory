# .github/workflows/sync-cnb.yml

name: Sync to CNB
on: [push]

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Sync to CNB Repository
              uses: docker://tencentcom/git-sync
              env:
                  PLUGIN_TARGET_URL: "https://cnb.cool/soucod-github/soucod/TencentDB-Agent-Memory.git"
                  PLUGIN_AUTH_TYPE: "https"
                  PLUGIN_USERNAME: "cnb"
                  PLUGIN_PASSWORD: ${{ secrets.GIT_CNB_TOKEN }}
                  PLUGIN_FORCE: "true"